<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASG • Controle de Manutenção</title>
  <meta name="theme-color" content="#0f766e" />
  <style>
    :root{--bg:#0b1220;--card:#101826;--muted:#8aa0b4;--fg:#e6edf3;--pri:#0ea5a6;--pri-2:#0f766e;--warn:#eab308;--bad:#ef4444;--good:#22c55e}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Arial,sans-serif;background:linear-gradient(120deg,#0b1220,#0b1626);color:var(--fg)}
    header{position:sticky;top:0;z-index:30;backdrop-filter:saturate(140%) blur(8px);background:#0b1220bb;border-bottom:1px solid #1f2b3a}
    .wrap{max-width:1100px;margin:0 auto;padding:16px}
    .brand{display:flex;gap:12px;align-items:center}
    .brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0ea5a6,#22d3ee)}
    .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
    .grid{display:grid;gap:16px}
    .grid.cards{grid-template-columns:repeat(12,1fr)}
    .card{background:var(--card);border:1px solid #1f2b3a;border-radius:16px;padding:16px}
    .card h3{margin:0 0 6px 0;font-size:14px;font-weight:600;color:#cbd5e1}
    .kpi{font-size:22px;font-weight:800}
    .kpi.bad{color:var(--bad)}.kpi.warn{color:var(--warn)}.kpi.good{color:var(--good)}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px}
    .section-title h2{margin:0;font-size:18px}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    select,input,button,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #243244;background:#0f172a;color:var(--fg);outline:none}
    select:focus,input:focus,textarea:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px #0ea5a633}
    label{font-size:12px;color:#94a3b8}
    .row{display:grid;gap:12px}
    .row.cols-2{grid-template-columns:1fr 1fr}
    .row.cols-3{grid-template-columns:repeat(3,1fr)}
    .row.cols-4{grid-template-columns:repeat(4,1fr)}
    .btn{cursor:pointer;background:linear-gradient(135deg,#0ea5a6,#0f766e);border:0;font-weight:700}
    .btn.secondary{background:#0b1220;border:1px solid #1f2b3a}
    .btn.warn{background:linear-gradient(135deg,#eab308,#f59e0b)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #1f2b3a;padding:10px;text-align:left;font-size:14px}
    th{color:#a9bacb;font-weight:600}
    .status{font-weight:700;padding:2px 8px;border-radius:999px;font-size:12px;display:inline-block}
    .s-ok{background:#052e2c;color:#34d399;border:1px solid #115e59}
    .s-soon{background:#302806;color:#facc15;border:1px solid #7c5c0a}
    .s-late{background:#3a0a0a;color:#fca5a5;border:1px solid #7f1d1d}
    footer{opacity:.7;text-align:center;padding:24px}
    @media (max-width: 920px){
      .grid.cards{grid-template-columns:1fr 1fr}
      .row.cols-3{grid-template-columns:1fr 1fr}
      .row.cols-4{grid-template-columns:1fr 1fr}
    }
    @media (max-width: 640px){
      .grid.cards{grid-template-columns:1fr}
      .row.cols-2,.row.cols-3,.row.cols-4{grid-template-columns:1fr}
      .wrap{padding:12px}
    }
    .toast{position:fixed;bottom:16px;right:16px;background:#0f172a;border:1px solid #1f2b3a;padding:12px 14px;border-radius:12px;display:none;z-index:50}
  </style>
</head>
<body>
  <header>
    <div class="wrap brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>ASG • Controle de Manutenção</h1>
    </div>
  </header>

  <main class="wrap" id="app">

    <section class="grid cards" style="margin-top:14px">
      <div class="card" style="grid-column:span 4">
        <h3>Manutenções vencidas</h3>
        <div id="kpiVenc" class="kpi bad">–</div>
      </div>
      <div class="card" style="grid-column:span 4">
        <h3>Vencem em breve</h3>
        <div id="kpiBreve" class="kpi warn">–</div>
      </div>
      <div class="card" style="grid-column:span 4">
        <h3>Em dia</h3>
        <div id="kpiDia" class="kpi good">–</div>
      </div>
    </section>

    <section class="card" style="margin-top:16px">
      <div class="section-title">
        <h2>Nova manutenção</h2>
        <div class="controls">
          <button class="btn secondary" id="btnSync">↻ Sincronizar</button>
        </div>
      </div>
      <form id="formNew" onsubmit="return false;">
        <div class="row cols-3">
          <div>
            <label for="idAtivo">Ativo</label>
            <select id="idAtivo" required></select>
          </div>
          <div>
            <label for="tipoServ">Tipo de serviço</label>
            <select id="tipoServ" required>
              <option value="">Selecione…</option>
              <option>Troca óleo motor</option>
              <option>Troca óleo hidráulico</option>
              <option>Troca óleo transmissão</option>
              <option>Troca filtro óleo</option>
              <option>Troca filtro combustível</option>
              <option>Troca filtro ar</option>
              <option>Lubrificação mancal</option>
              <option>Lubrificação geral</option>
              <option>Inspeção/Limpeza filtro ar</option>
            </select>
          </div>
          <div>
            <label for="data">Data</label>
            <input id="data" type="date" required />
          </div>
        </div>
        <div class="row cols-3" style="margin-top:10px">
          <div>
            <label for="leituraAtual">Leitura atual (horas/km)</label>
            <input id="leituraAtual" type="number" inputmode="decimal" placeholder="ex.: 3850" />
          </div>
          <div>
            <label for="leituraTroca">Leitura na troca</label>
            <input id="leituraTroca" type="number" inputmode="decimal" placeholder="ex.: 3650" />
          </div>
          <div>
            <label for="responsavel">Responsável</label>
            <input id="responsavel" placeholder="ex.: Carlos" />
          </div>
        </div>
        <div class="row" style="margin-top:10px">
          <div>
            <label for="obs">Observações</label>
            <textarea id="obs" rows="3" placeholder="Observações (opcional)"></textarea>
          </div>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
          <button class="btn secondary" type="button" id="btnClear">Limpar</button>
          <button class="btn" id="btnSave">Salvar manutenção</button>
        </div>
      </form>
    </section>

    <section class="card" style="margin-top:16px">
      <div class="section-title">
        <h2>Próximas manutenções</h2>
        <div class="controls">
          <input id="search" placeholder="Filtrar por máquina, tipo ou status…"/>
        </div>
      </div>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Ativo</th>
              <th>Máquina</th>
              <th>Tipo</th>
              <th>Próx. leitura</th>
              <th>Próx. data</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tblUpcoming"></tbody>
        </table>
      </div>
    </section>

  </main>

  <div id="toast" class="toast"></div>

  <footer>
    <small>Agropecuária São Gabriel — aplicativo HTML + Google Sheets • v1.0</small>
  </footer>

  <script>
    const API_BASE = localStorage.getItem('ASG_API') || 'https://script.google.com/macros/s/SEU_DEPLOY_ID/exec';
    const OFFLINE_QUEUE = true;

    const $ = (s)=>document.querySelector(s);
    const fmtDate = (d)=> d? new Date(d).toLocaleDateString('pt-BR') : '';
    const toast = (msg)=>{ const t=$('#toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }

    function statusPill(s){
      if(!s) return '';
      const cls = s.includes('VENCIDO')? 's-late' : (s.includes('BREVE')? 's-soon' : 's-ok');
      return `<span class="status ${cls}">${s}</span>`;
    }

    async function apiGet(path){
      const url = `${API_BASE}?fn=${encodeURIComponent(path)}`;
      const r = await fetch(url, {method:'GET', headers:{'Accept':'application/json'}});
      if(!r.ok) throw new Error('GET falhou');
      return r.json();
    }
    async function apiPost(payload){
      const r = await fetch(API_BASE, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      if(!r.ok) throw new Error('POST falhou');
      return r.json();
    }

    let ASSETS = [];
    let UPCOMING = [];

    async function loadAssets(){
      const data = await apiGet('getAssets');
      ASSETS = data.assets || [];
      const sel = $('#idAtivo'); sel.innerHTML = '<option value="">Selecione…</option>' + ASSETS.map(a=>`<option value="${a.id}">${a.id} — ${a.nome}</option>`).join('');
    }

    async function loadUpcoming(){
      const data = await apiGet('getUpcoming');
      UPCOMING = data.items || [];
      renderUpcoming();
      const kLate = UPCOMING.filter(x=>x.status && x.status.includes('VENCIDO')).length;
      const kSoon = UPCOMING.filter(x=>x.status && x.status.includes('BREVE')).length;
      const kOk = UPCOMING.filter(x=>x.status && x.status.includes('EM DIA')).length;
      $('#kpiVenc').textContent = kLate;
      $('#kpiBreve').textContent = kSoon;
      $('#kpiDia').textContent = kOk;
    }

    function renderUpcoming(){
      const q = ($('#search').value||'').toLowerCase();
      const rows = UPCOMING
        .filter(x=>!q || [x.id,x.nome,x.tipo,x.status].join(' ').toLowerCase().includes(q))
        .map(x=>`<tr>
          <td>${x.id||''}</td>
          <td>${x.nome||''}</td>
          <td>${x.tipo_servico||''}</td>
          <td>${x.prox_leitura||''}</td>
          <td>${fmtDate(x.prox_data)||''}</td>
          <td>${statusPill(x.status||'')}</td>
        </tr>`).join('');
      $('#tblUpcoming').innerHTML = rows || '<tr><td colspan="6">Sem registros</td></tr>';
    }

    async function saveMaintenance(){
      const payload = {
        fn: 'addMaintenance',
        data: {
          idAtivo: $('#idAtivo').value,
          tipoServico: $('#tipoServ').value,
          data: $('#data').value,
          leituraAtual: $('#leituraAtual').value,
          leituraTroca: $('#leituraTroca').value,
          responsavel: $('#responsavel').value,
          observacoes: $('#obs').value
        }
      };
      if(!payload.data.idAtivo || !payload.data.tipoServico || !payload.data.data){
        toast('Preencha Ativo, Tipo de serviço e Data.');
        return;
      }
      try{
        const res = await apiPost(payload);
        if(res && res.ok){
          toast('Manutenção salva!');
          $('#formNew').reset();
          $('#data').valueAsNumber = Date.now() - new Date().getTimezoneOffset()*60000;
          await loadUpcoming();
        }else{
          throw new Error('Erro no retorno');
        }
      }catch(err){
        if(OFFLINE_QUEUE){
          const queued = JSON.parse(localStorage.getItem('ASG_QUEUE')||'[]');
          queued.push(payload);
          localStorage.setItem('ASG_QUEUE', JSON.stringify(queued));
          toast('Sem conexão: salvo na fila offline.');
        }else{
          toast('Falha ao salvar. Verifique conexão.');
        }
      }
    }

    async function flushQueue(){
      const queued = JSON.parse(localStorage.getItem('ASG_QUEUE')||'[]');
      if(!queued.length) return toast('Nada para sincronizar.');
      let ok=0; let fail=0;
      for(const p of queued){
        try{ const r=await apiPost(p); if(r && r.ok){ ok++; } else { fail++; } }
        catch{ fail++; }
      }
      if(fail===0){ localStorage.removeItem('ASG_QUEUE'); }
      toast(`Sincronização: ${ok} enviados, ${fail} falharam.`);
      await loadUpcoming();
    }

    document.getElementById('btnSave').addEventListener('click', saveMaintenance);
    document.getElementById('btnClear').addEventListener('click', ()=>document.getElementById('formNew').reset());
    document.getElementById('btnSync').addEventListener('click', flushQueue);
    document.getElementById('search').addEventListener('input', renderUpcoming);

    (async function init(){
      document.getElementById('data').valueAsNumber = Date.now() - new Date().getTimezoneOffset()*60000;
      try{ await loadAssets(); await loadUpcoming(); }
      catch(e){ toast('Conecte seu Apps Script (API_BASE).'); }
    })();
  </script>
</body>
</html>
